name: Расшифровки Якеменко

on:
  push:
    branches: [claude/yakemenko-interview-transcripts-o97e92]
    paths: ["yakemenko/*.py", "yakemenko/videos.txt", ".github/workflows/yakemenko.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -U yt-dlp faster-whisper
      - name: Поиск и расшифровка
        working-directory: yakemenko
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          EXTRA=""
          if [ -n "$YT_COOKIES" ]; then printf '%s\n' "$YT_COOKIES" > /tmp/cookies.txt; EXTRA="--cookies /tmp/cookies.txt"; fi
          python yakemenko.py --model small $EXTRA
      - name: Сохранить список найденного в репозиторий
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add yakemenko/found.csv yakemenko/found.md || true
          git diff --cached --quiet || { git commit -m "Обновить список видео Якеменко [skip ci]" && git push; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yakemenko-rasshifrovki
          path: |
            yakemenko/ВСЕ_РАСШИФРОВКИ.txt
            yakemenko/transcripts/
            yakemenko/found.csv
            yakemenko/found.md
          if-no-files-found: warn
